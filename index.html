
<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Moon Case</title>
  <link rel="icon" href="data:,">

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Автоматическая версия файлов -->
  <script>
    const version = Date.now();

    document.write(`
      <link rel="stylesheet" href="css/main.css?v=${version}">
      <link rel="stylesheet" href="css/profile.css?v=${version}">

      <script defer src="js/app.js?v=${version}"><\/script>
      <script defer src="js/profile.js?v=${version}"><\/script>
    `);
  </script>
</head>

<body>
  <main class="screen" id="screen" aria-label="Игры">

    <header class="topbar">
      <div class="topbar-actions">

        <!-- Баланс -->
        <button class="balance-chip" type="button" aria-label="Баланс">
          <span class="balance-chip__amount">0</span>
          <img class="balance-chip__coin" src="assets/icons/telegram-star.png" alt="">
        </button>

        <!-- Пополнение -->
        <button class="deposit-button" type="button" aria-label="Пополнить">
          <span class="plus-icon"></span>
        </button>

        <!-- Аватар пользователя -->
        <button class="profile-button" type="button" aria-label="Профиль">
          <img class="profile-button__icon telegram-user-photo" src="assets/icons/profile.png" alt="">
        </button>

      </div>
    </header>

    <!-- LIVE: последние выигрыши -->
    <section class="live-row" aria-label="Последние выигрыши">

      <!-- Вертикальная плашка LIVE -->
      <div class="live-label">
        <span class="live-label__dot"></span>
        <span class="live-label__text">LIVE</span>
      </div>

      <!-- Горизонтальная лента -->
      <div class="live-list">

        <!-- Evil Eye: Event Horizon -->
        <article class="live-card live-card--purple">
          <img
            class="live-card__item"
            src="assets/icons/NFT/Evil_Eye/Event_Horizon.webp"
            alt="Evil Eye — Event Horizon"
          >
          <div class="live-card__info">
            <img src="assets/icons/telegram-star.png" alt="">
            <span>1 500</span>
          </div>
        </article>

        <!-- Liberty Figure: Deputy -->
        <article class="live-card live-card--blue">
          <img
            class="live-card__item"
            src="assets/icons/NFT/Liberty_Figure/Deputy.webp"
            alt="Liberty Figure — Deputy"
          >
          <div class="live-card__info">
            <img src="assets/icons/telegram-star.png" alt="">
            <span>3 000</span>
          </div>
        </article>

        <!-- Lollipop: Tamagotchi -->
        <article class="live-card live-card--pink">
          <img
            class="live-card__item"
            src="assets/icons/NFT/Lollipop/Tamagotchi.webp"
            alt="Lollipop — Tamagotchi"
          >
          <div class="live-card__info">
            <img src="assets/icons/telegram-star.png" alt="">
            <span>2 500</span>
          </div>
        </article>

        <!-- Resistance Dog: Raincoat -->
        <article class="live-card live-card--green">
          <img
            class="live-card__item"
            src="assets/icons/NFT/Resistance_Dog/Raincoat.webp"
            alt="Resistance Dog — Raincoat"
          >
          <div class="live-card__info">
            <img src="assets/icons/telegram-star.png" alt="">
            <span>5 000</span>
          </div>
        </article>

        <!-- Toy Bear: Deadpool -->
        <article class="live-card live-card--red">
          <img
            class="live-card__item"
            src="assets/icons/NFT/Toy Bear/Deadpool.webp"
            alt="Toy Bear — Deadpool"
          >
          <div class="live-card__info">
            <img src="assets/icons/telegram-star.png" alt="">
            <span>1 000</span>
          </div>
        </article>

      </div>
    </section>


<!-- Баннер -->
<section class="promo-banner" aria-label="Промо-баннер">
  <img
    class="promo-banner__image"
    src="assets/icons/banner1.png"
    alt="Подарочный сундук"
  >
</section>

<section class="page-placeholder" aria-hidden="true"></section>
</main>


  <!-- Нижнее меню -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Основное меню">

    <div class="nav-indicator" id="navIndicator" aria-hidden="true"></div>

    <button class="nav-item is-active" type="button" data-page="games" aria-current="page">
      <img class="nav-icon" src="assets/icons/games.png" alt="" aria-hidden="true">
      <span>Игры</span>
    </button>

    <button class="nav-item" type="button" data-page="cases">
      <img class="nav-icon" src="assets/icons/cases.png" alt="" aria-hidden="true">
      <span>Кейсы</span>
    </button>

    <button class="nav-item" type="button" data-page="bonuses">
      <img class="nav-icon" src="assets/icons/bonuses.png" alt="" aria-hidden="true">
      <span>Бонусы</span>
    </button>

    <button class="nav-item" type="button" data-page="profile">
      <img class="nav-icon telegram-user-photo" src="assets/icons/profile.png" alt="" aria-hidden="true">
      <span>Профиль</span>
    </button>

  </nav>
</body>
</html>
