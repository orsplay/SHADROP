
<section class="shadrop-case-page">

  <!-- ===== РУЛЕТКИ ===== -->
  <div
    class="shadrop-roulettes"
    id="caseRoulettes"
  ></div>

  <!-- ===== УПРАВЛЕНИЕ ===== -->
  <div class="shadrop-case-controls">

    <div class="shadrop-case-multipliers">
      <button class="shadrop-multiplier is-active"
        data-multiplier="1" type="button">x1</button>

      <button class="shadrop-multiplier"
        data-multiplier="2" type="button">x2</button>

      <button class="shadrop-multiplier"
        data-multiplier="3" type="button">x3</button>

      <button class="shadrop-multiplier"
        data-multiplier="4" type="button">x4</button>

      <button class="shadrop-multiplier"
        data-multiplier="5" type="button">x5</button>
    </div>

    <!-- Переключатель деморежима -->
    <button
      class="shadrop-demo-button"
      id="caseDemoButton"
      type="button"
      aria-pressed="false"
    >Демо</button>

  </div>

  <!-- ===== КНОПКА ОТКРЫТИЯ ===== -->
  <button
    class="shadrop-open-button"
    id="caseOpenButton"
    type="button"
  >
    <span id="caseOpenLabel">Открыть за</span>
    <span id="caseOpenPrice">99</span>

    <img
      id="caseOpenStar"
      src="assets/icons/telegram-star.png"
      alt="Stars"
    >
  </button>

  <!-- ===== ВОЗМОЖНЫЕ НАГРАДЫ ===== -->
  <div class="shadrop-case-rewards">

    <div class="shadrop-case-rewards__heading">
      <h2>Возможные награды</h2>
    </div>

    <div
      class="shadrop-case-rewards__grid"
      id="caseRewardsGrid"
    ></div>

  </div>

  <!-- ===== ОКНО ВЫИГРЫША ===== -->
  <div
    class="shadrop-win-overlay"
    id="caseWinOverlay"
    hidden
  >

    <div
      class="shadrop-win-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="caseWinTitle"
    >

      <!-- Закрыть -->
      <button
        class="shadrop-win-close"
        id="caseWinClose"
        type="button"
        aria-label="Закрыть"
      >×</button>

      <!-- Заголовок меняется через JS -->
      <h2 id="caseWinTitle">Ваш подарок</h2>

      <p id="caseWinDescription">
        Демонстрация: подарки не добавляются в инвентарь
      </p>

      <!-- Один подарок (x1) -->
      <div class="shadrop-win-image-wrap">
        <img id="caseWinImage" src="" alt="Подарок">
      </div>

      <div
        class="shadrop-win-name"
        id="caseWinName"
      ></div>

      <div
        class="shadrop-win-rarity"
        id="caseWinRarity"
      ></div>

      <!-- Несколько подарков (x2–x5) -->
      <div
        class="shadrop-win-multiple"
        id="caseWinMultiple"
        hidden
      ></div>

      <!-- Общая стоимость -->
      <div
        class="shadrop-win-total"
        id="caseWinTotal"
        hidden
      ></div>

      <!-- Продолжить -->
      <button
        class="shadrop-win-continue"
        id="caseWinContinue"
        type="button"
      >Продолжить</button>

    </div>
  </div>

</section>
