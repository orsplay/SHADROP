<!-- ===== УНИВЕРСАЛЬНАЯ СТРАНИЦА КЕЙСА ===== -->

<section class="shadrop-case-page">

  <!-- Заголовок -->
  <div class="shadrop-case-header">

    <button
      class="shadrop-case-back"
      type="button"
      id="caseBackButton"
    >
      <span class="shadrop-case-back__arrow">‹</span>
      <span>Назад</span>
    </button>

    <div class="shadrop-case-header__title">
      SHADROP
    </div>

    <div class="shadrop-case-header__spacer"></div>

  </div>

  <!-- Информация о кейсе -->
  <div class="shadrop-case-hero">

    <div class="shadrop-case-hero__glow"></div>

    <img
      id="caseHeroImage"
      class="shadrop-case-hero__image"
      src=""
      alt=""
    >

    <h1 id="caseHeroTitle">
      Кейс
    </h1>

    <p id="caseHeroDescription">
      Открой коллекцию подарков
    </p>

  </div>

  <!-- Рулетка -->
  <div class="shadrop-roulette">

    <div class="shadrop-roulette__pointer shadrop-roulette__pointer--top"></div>

    <div class="shadrop-roulette__viewport" id="rouletteViewport">

      <div class="shadrop-roulette__track" id="rouletteTrack">
      </div>

    </div>

    <div class="shadrop-roulette__pointer shadrop-roulette__pointer--bottom"></div>

    <div class="shadrop-roulette__center"></div>

  </div>

  <!-- Управление -->
  <div class="shadrop-case-controls">

    <div class="shadrop-case-multipliers">

      <button class="shadrop-multiplier is-active" data-multiplier="1" type="button">
        x1
      </button>

      <button class="shadrop-multiplier" data-multiplier="2" type="button">
        x2
      </button>

      <button class="shadrop-multiplier" data-multiplier="3" type="button">
        x3
      </button>

    </div>

    <button
      class="shadrop-demo-button"
      id="caseDemoButton"
      type="button"
    >
      ⚡ Демо
    </button>

  </div>

  <!-- Кнопка открытия -->
  <button
    class="shadrop-open-button"
    id="caseOpenButton"
    type="button"
  >
    <span>Открыть за</span>

    <span id="caseOpenPrice">99</span>

    <img
      src="assets/icons/telegram-star.png"
      alt=""
    >
  </button>

  <!-- Результат -->
  <div
    class="shadrop-case-result"
    id="caseResult"
    hidden
    aria-live="polite"
  >
  </div>

  <!-- Призы -->
  <div class="shadrop-case-rewards">

    <div class="shadrop-case-rewards__heading">

      <span class="shadrop-case-rewards__sparkle">✦</span>

      <h2>Возможные награды</h2>

    </div>

    <div
      class="shadrop-case-rewards__grid"
      id="caseRewardsGrid"
    >
    </div>

  </div>

</section>
