
<!-- ===== КАТАЛОГ КЕЙСОВ SHADROP ===== -->

<section class="cases-page" aria-label="Каталог кейсов">

  <!-- Заголовок страницы -->
  <div class="cases-heading">
    <h1>Кейсы</h1>
    <span class="cases-heading__count">SHADROP</span>
  </div>

  <!-- Фильтры -->
  <div class="cases-filters" aria-label="Категории кейсов">

    <button
      class="cases-filter is-active"
      type="button"
      data-filter="all"
    >
      Все кейсы
    </button>

    <button
      class="cases-filter"
      type="button"
      data-filter="free"
    >
      Бесплатные
    </button>

    <button
      class="cases-filter"
      type="button"
      data-filter="cheap"
    >
      Бюджетные
    </button>

    <button
      class="cases-filter"
      type="button"
      data-filter="premium"
    >
      Премиум
    </button>

  </div>

  <!-- Название каталога -->
  <div class="cases-catalog-heading">
    <h2>Все кейсы</h2>
    <span class="cases-visible-count">4 кейса</span>
  </div>

  <!-- Карточки кейсов -->
  <div class="cases-grid">

    <!-- Огненный -->
    <button
      class="case-card case-card--orange"
      type="button"
      data-category="cheap"
      data-case="fire"
    >
      <span class="case-card__name">Огненный</span>

      <img
        class="case-card__image"
        src="assets/icons/case.png"
        alt="Огненный кейс"
        loading="lazy"
      >

      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        <span>99</span>
      </span>
    </button>

    <!-- Магический -->
    <button
      class="case-card case-card--pink"
      type="button"
      data-category="cheap"
      data-case="magic"
    >
      <span class="case-card__name">Магический</span>

      <img
        class="case-card__image"
        src="assets/icons/case.png"
        alt="Магический кейс"
        loading="lazy"
      >

      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        <span>199</span>
      </span>
    </button>

    <!-- Кристалл -->
    <button
      class="case-card case-card--blue"
      type="button"
      data-category="premium"
      data-case="crystal"
    >
      <span class="case-card__name">Кристалл</span>

      <img
        class="case-card__image"
        src="assets/icons/case.png"
        alt="Кристальный кейс"
        loading="lazy"
      >

      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        <span>499</span>
      </span>
    </button>

    <!-- Легендарный -->
    <button
      class="case-card case-card--purple"
      type="button"
      data-category="premium"
      data-case="legendary"
    >
      <span class="case-card__name">Легендарный</span>

      <img
        class="case-card__image"
        src="assets/icons/case.png"
        alt="Легендарный кейс"
        loading="lazy"
      >

      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        <span>999</span>
      </span>
    </button>

  </div>

</section>
