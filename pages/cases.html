
<!-- ===== СТРАНИЦА КЕЙСОВ SHADROP ===== -->

<section class="cases-page">

  <!-- Заголовок -->
  <div class="cases-heading">
    <h1>Кейсы</h1>
    <span class="cases-heading__count">SHADROP</span>
  </div>

  <!-- Категории -->
  <div class="cases-filters">

    <button class="cases-filter is-active"
            data-filter="all" type="button">
      Все кейсы
    </button>

    <button class="cases-filter"
            data-filter="free" type="button">
      Бесплатные
    </button>

    <button class="cases-filter"
            data-filter="cheap" type="button">
      Бюджетные
    </button>

    <button class="cases-filter"
            data-filter="premium" type="button">
      Премиум
    </button>

  </div>

  <!-- Заголовок каталога -->
  <div class="cases-catalog-heading">
    <h2>Все кейсы</h2>
    <span class="cases-visible-count">4 кейса</span>
  </div>

  <!-- Сетка кейсов -->
  <div class="cases-grid">

    <button class="case-card case-card--orange"
            data-category="cheap" type="button">
      <span class="case-card__name">Огненный</span>
      <img class="case-card__image"
           src="assets/icons/case.png" alt="">
      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        99
      </span>
    </button>

    <button class="case-card case-card--pink"
            data-category="cheap" type="button">
      <span class="case-card__name">Магический</span>
      <img class="case-card__image"
           src="assets/icons/case.png" alt="">
      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        199
      </span>
    </button>

    <button class="case-card case-card--blue"
            data-category="premium" type="button">
      <span class="case-card__name">Кристалл</span>
      <img class="case-card__image"
           src="assets/icons/case.png" alt="">
      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        499
      </span>
    </button>

    <button class="case-card case-card--purple"
            data-category="premium" type="button">
      <span class="case-card__name">Легендарный</span>
      <img class="case-card__image"
           src="assets/icons/case.png" alt="">
      <span class="case-card__price">
        <img src="assets/icons/telegram-star.png" alt="">
        999
      </span>
    </button>

  </div>

</section>
