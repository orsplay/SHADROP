
<section class="player-profile" aria-label="Профиль игрока">

  <!-- ===== ПРОФИЛЬ ===== -->
  <div class="player-card">

    <!-- Верхняя часть профиля -->
    <div class="player-card__top">

      <div class="player-card__user">

        <div class="player-avatar">
          <img id="playerAvatar" alt="Аватар игрока" hidden>
          <span id="playerInitial">?</span>
        </div>

        <div class="player-identity">
          <div class="player-identity__row">
            <span class="player-name" id="playerName">Игрок</span>
            <span class="player-level__badge">1 LVL</span>
          </div>

          <span class="player-id" id="playerId">ID: —</span>
        </div>

      </div>

      <!-- Кнопки пополнения и вывода -->
      <div class="player-actions">

        <button class="player-actions__deposit" type="button">
          Пополнить
        </button>

        <button class="player-actions__withdraw" type="button">
          Вывод
        </button>

      </div>

    </div>

    <!-- Нижняя часть с уровнем -->
    <div class="player-level">

      <div class="player-level__track">
        <div class="player-level__progress"></div>
      </div>

      <div class="player-level__meta">
        <span class="player-level__current">1 LVL</span>
        <span class="player-level__xp-total">0 / 100 XP</span>
      </div>

    </div>

  </div>


  <!-- ===== ИНВЕНТАРЬ ===== -->
  <section class="inventory-card" aria-label="Инвентарь">

    <div class="inventory-empty">

      <img
        class="inventory-empty__animation"
        src="assets/icons/Redo.png"
        alt="Инвентарь пуст"
      >

      <h2 class="inventory-empty__title">
        Инвентарь пуст
      </h2>

      <p class="inventory-empty__description">
        Добавь NFT через бота и получи Stars!
      </p>

      <button class="inventory-empty__button" type="button">
        Добавить
      </button>

    </div>

  </section>


  <!-- ===== РЕФЕРАЛЬНАЯ ПРОГРАММА ===== -->
  <section class="referral-card" aria-label="Реферальная программа">

    <!-- Заголовок -->
    <div class="referral-card__header">

      <div class="referral-card__icon">
        <img
          src="assets/icons/referral-users.png"
          alt=""
        >
      </div>

      <div class="referral-card__heading">
        <h3>Приглашай друзей</h3>
        <p>Получай 10% с игры приглашённых друзей</p>
      </div>

    </div>


    <!-- ===== СТАТИСТИКА РЕФЕРАЛОВ ===== -->
    <div class="referral-card__stats">

      <!-- Количество рефералов -->
      <div class="referral-stat">

        <strong>0</strong>
        <span>Рефералов</span>

        <div class="referral-stat__symbol">
          +
        </div>

      </div>


      <!-- Заработано Stars -->
      <div class="referral-stat">

        <strong class="referral-stat__amount">
          0.00

          <img
            class="referral-stat__star"
            src="assets/icons/telegram-star.png"
            alt="Stars"
          >
        </strong>

        <span>Заработано</span>

        <!-- Стрелка вверх-вправо -->
        <div class="referral-stat__symbol referral-stat__symbol--dark">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 19L19 5"/>
            <path d="M8 5h11v11"/>
          </svg>

        </div>

      </div>

    </div>


    <!-- ===== РЕФЕРАЛЬНАЯ ССЫЛКА ===== -->
    <div class="referral-card__link">

      <span class="referral-card__url">
        Реферальная ссылка
      </span>


      <!-- Поделиться ссылкой -->
      <button
        class="referral-card__link-button"
        type="button"
        aria-label="Поделиться ссылкой"
        disabled
      >
        <img
          class="referral-card__share-icon"
          src="assets/icons/share.png"
          alt=""
        >
      </button>


      <!-- Копировать ссылку -->
      <button
        class="referral-card__link-button"
        type="button"
        aria-label="Копировать ссылку"
        disabled
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect
            x="8"
            y="8"
            width="12"
            height="12"
            rx="2"
          />

          <path
            d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
          />
        </svg>
      </button>

    </div>

  </section>

</section>
